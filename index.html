<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARTIN SPIN CHALLENGE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 35%,#26325d,#080b19 75%);font-family:Tahoma,Arial,sans-serif;color:white;overflow:hidden}main{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 20px}header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#ffffff17;border:1px solid #ffffff30;border-radius:15px;padding:9px 12px;font-size:13px}h1{font-size:20px;letter-spacing:2px;margin:8px 0;color:#ffd77d;text-shadow:0 0 20px #ffb83388}canvas{width:100%;max-width:480px;flex:1;min-height:0;touch-action:manipulation;cursor:pointer}button{border:0;border-radius:16px;background:linear-gradient(135deg,#ffd96d,#ff8c56);color:#222;font-weight:900;padding:14px 28px;font-size:17px;box-shadow:0 8px 24px #ff9c5a55;cursor:pointer}footer{font-size:12px;opacity:.75;margin-top:9px;text-align:center}#overlay{position:fixed;inset:0;background:#050814b9;display:flex;justify-content:center;align-items:center;padding:25px;z-index:4}#overlay.hidden{display:none}.panel{width:min(370px,100%);text-align:center;background:#1c2345;border:1px solid #ffffff30;border-radius:25px;padding:28px 20px;box-shadow:0 20px 90px #0009}.panel h2{color:#ffd77d;margin:0 0 12px}.panel p{line-height:2;font-size:14px;color:#dce1ff}#throw{width:min(400px,100%);touch-action:manipulation}</style></head><body><main><h1>ARTIN SPIN CHALLENGE</h1><header><div class="pill">مرحله: <b id="level">۱</b></div><div class="pill">امتیاز: <b id="score">۰</b></div><div class="pill">پرتاب باقی‌مانده: <b id="remaining">۵</b></div></header><canvas id="game"></canvas><button id="throw">🩴 پرتاب دمپایی!</button><footer>برای پرتاب، صفحه یا دکمه را لمس کن • به دمپایی‌های قبلی برخورد نکن</footer></main><div id="overlay"><div class="panel"><h2 id="modalTitle">🎯 چالش چرخش آرتین</h2><p id="modalText">هدف کارتونی می‌چرخد! دمپایی‌های فانتزی را به حلقه بچسبان؛ اگر دو دمپایی به هم برخورد کنند، می‌بازی.</p><button id="start">شروع بازی</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('modalTitle'),message=document.getElementById('modalText'),start=document.getElementById('start'),throwBtn=document.getElementById('throw');let W=400,H=600,dpr=1,level=1,score=0,remaining=5,angle=0,speed=.018,attached=[],projectile=null,particles=[],playing=false,last=0,transition=0;const TAU=Math.PI*2;function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function hud(){document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('remaining').textContent=remaining}function setup(){angle=0;attached=[];projectile=null;particles=[];remaining=Math.min(4+level,10);speed=(.015+level*.0025)*(level%2?-1:1);transition=0;hud()}function show(t,m,b){playing=false;title.textContent=t;message.textContent=m;start.textContent=b;overlay.classList.remove('hidden')}function begin(){level=1;score=0;setup();playing=true;overlay.classList.add('hidden')}start.onclick=begin;function shoot(){if(!playing||projectile||transition)return;const cx=W/2,cy=Math.min(H*.37,240),radius=Math.min(W*.25,100);projectile={x:cx,y:H-83,target:cy+radius+31,speed:Math.max(13,H*.033)};}
throwBtn.addEventListener('click',shoot);canvas.addEventListener('pointerdown',shoot);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot()}});function slipper(x,y,rotation,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(scale,scale);ctx.shadowColor='#ff9d5e';ctx.shadowBlur=10;ctx.fillStyle='#ffbc6b';ctx.beginPath();ctx.ellipse(0,0,12,23,0,0,TAU);ctx.fill();ctx.strokeStyle='#5e3657';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(0,5);ctx.lineTo(9,-6);ctx.stroke();ctx.restore()}function burst(x,y){for(let i=0;i<17;i++){const a=Math.random()*TAU,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35,color:['#ffd86e','#ff8868','#87e8ff'][i%3]})}}function update(dt){if(playing){angle+=speed*dt;if(projectile){projectile.y-=projectile.speed*dt;if(projectile.y<=projectile.target){const hitAngle=((Math.PI/2-angle)%TAU+TAU)%TAU;const collision=attached.some(a=>Math.abs(Math.atan2(Math.sin(a-hitAngle),Math.cos(a-hitAngle)))<.28);projectile=null;const cy=Math.min(H*.37,240),radius=Math.min(W*.25,100);burst(W/2,cy+radius+25);if(collision){show('💥 برخورد کردی!','امتیاز نهایی: '+score+' | تا مرحله '+level+' رسیدی. دوباره امتحان کن!','دوباره بازی کن')}else{attached.push(hitAngle);score+=10;remaining--;hud();if(remaining===0)transition=42}}}}if(transition>0){transition-=dt;if(transition<=0){level++;setup();speed*=1;}}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}function draw(){ctx.clearRect(0,0,W,H);const cx=W/2,cy=Math.min(H*.37,240),radius=Math.min(W*.25,100);for(let i=0;i<18;i++){const a=i*TAU/18;ctx.fillStyle='#ffffff09';ctx.beginPath();ctx.arc(cx+Math.cos(a)*(radius+52),cy+Math.sin(a)*(radius+52),3,0,TAU);ctx.fill()}ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.shadowColor='#7deaff';ctx.shadowBlur=28;ctx.fillStyle='#4b568e';ctx.strokeStyle='#8ceaff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,radius,0,TAU);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffd7a0';ctx.beginPath();ctx.arc(0,0,radius*.67,0,TAU);ctx.fill();ctx.fillStyle='#292341';ctx.beginPath();ctx.arc(-radius*.23,-radius*.08,5,0,TAU);ctx.arc(radius*.23,-radius*.08,5,0,TAU);ctx.fill();ctx.strokeStyle='#a65c68';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,radius*.10,radius*.2,.15,Math.PI-.15);ctx.stroke();ctx.fillStyle='#272341';ctx.beginPath();ctx.arc(0,-radius*.48,radius*.53,Math.PI,TAU);ctx.fill();ctx.font=`bold ${Math.max(12,radius*.17)}px Tahoma`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('ARTIN',0,radius*.88);attached.forEach(a=>{const x=Math.cos(a)*(radius+30),y=Math.sin(a)*(radius+30);slipper(x,y,a-Math.PI/2,.85)});ctx.restore();if(projectile)slipper(projectile.x,projectile.y,0,1);else if(playing)slipper(cx,H-83,0,1);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,TAU);ctx.fill()});ctx.globalAlpha=1;if(transition>0){ctx.textAlign='center';ctx.font='bold 28px Tahoma';ctx.fillStyle='#ffe082';ctx.fillText('مرحله بعد! ✨',cx,H*.72)}}function frame(t){const dt=Math.min((t-last)/16.667||1,2);last=t;update(dt);draw();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);
</script></body></html>
